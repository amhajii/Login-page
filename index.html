<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div id="container" class="container">
        <div class="left-section">
            <!-- <div id="lan-change">En/Fa</div> -->
            <div class="left-section__title">
                <div class="left-section__title-h1">ورود به حساب کاربــری</div>
                <div class="left-section__title-Signin">
                    <div class="left-section__title-Signin-p">حــســاب کــاربــــــری نــداریـــــــــــــــد؟</div>
                    <a href="https://github.com/amhajii" class="left-section__title-Signin-link">عضویــت</a>

                </div>
            </div>

            <div class="left-section__inputs">
                
                <div class="left-section__inputs-user">
                    <input id="userName-input" type="text" placeholder="نام کاربــری یا ایمیل...">
                </div>

                <p id="pass-validation" class="pass-validation disable">یوزر نادرست است !</p>
                
                <div class="left-section__inputs-password">
                    <input id="pass-input" type="password" placeholder="رمـز عبور...">
                    
                    <svg class="svg-eye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                    </svg>

                    <svg class="svg-eye disable" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill" viewBox="0 0 16 16">
                        <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                        <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                    </svg>
                    
                    
                </div>
                
                <p id="pass-validation" class="pass-validation disable">رمز نادرست است !</p>

                
                <div class="left-section__inputs-check">
                    <input type="checkbox" checked>
                    <p id="remember">من را به خاطر بسپار</p>

                </div>

            
            </div>


            <div class="left-section__btn">
                <!-- <button id="btn" type="button">تایـیـد</button> -->
                <button id="btn" type="button">ورود به حساب کاربـری</button>
            </div>


        </div>


        <div class="right-section">
            <div class="right-section__bx">
                <a href="https://github.com/amhajii" class="right-section__bx-description">H.SHAMS</a>
                <!-- <div class="right-section__bx-description">ظاهری جذاب و کاربردی <br> با افزونه لاگینو</div> -->
                <div class="spin"></div>
                <div class="right-section__Link"><a href="">بازگشت به  <b> صفحه اصلی</b></a></div>
                <!-- <img src="./art-legion-anonymous-guy-fawkes-watch-dogs-hd-wallpaper-preview.jpg" alt=""> -->
            </div>
        </div>
    </div>


        <script src="./style.js"></script>
    
</body>
</html>
